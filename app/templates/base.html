<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/layout.css"><link rel="stylesheet" href="/static/components.css"></head><body><div class="app"><aside class="rail"><a class="library" href="/">卷 · 期<br><span>PERIODICAL ARCHIVE</span></a><nav>{% for name in modules %}<a href="/module/{{loop.index}}?run_id={{run.id}}" class="{{'on' if active==loop.index else ''}}"><span>{{loop.index}}.</span>{{name}}</a>{% endfor %}</nav><p class="stamp">馆藏核验<br>编目室 / UTC</p></aside><div class="work"><header class="topbar"><span>COLLECTION / {{run.id[:8]}}</span><h1>{{modules[active-1]}}</h1><button class="btn" id="print">打印</button><a class="btn" href="/api/export/{{run.id}}">证据</a></header><main class="content">{% block pages %}{% endblock %}</main><footer class="statusbar"><span>规则版 {{run.rule_version}}</span><span>修订 {{run.revision}} · {{run.created[:19]}} UTC</span><a href="/docs">接口目录</a></footer></div></div><script src="/static/catalog.js" defer></script><script src="/static/spines.js" defer></script></body></html>
